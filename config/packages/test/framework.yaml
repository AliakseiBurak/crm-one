framework:
    # Тестовый режим: включён доступ к сервисам self::getContainer(),
    # сессия — mock-хранилище (нужно для loginUser()).
    test: true
    session:
        storage_factory_id: session.storage.factory.mock_file

# https://maks-rafalko.github.io/blog/2021-11-21/symfony-tests-performance/
doctrine:
    dbal:
        logging: false

# https://maks-rafalko.github.io/blog/2021-11-21/symfony-tests-performance/
security:
    password_hashers:
        App\Entity\User:
            algorithm: md5
            encode_as_base64: false
            iterations: 0
